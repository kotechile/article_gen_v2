version: '3.8'

services:
  backend:
    build: .
    restart: always
    environment:
      # Application
      - SECRET_KEY
      - DEBUG
      - ENVIRONMENT
      - LOG_LEVEL
      - API_KEYS

      # Database / Supabase
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - SUPABASE_ANON_KEY

      # Redis / Celery
      - REDIS_URL=redis://broker:6379/0
      - CELERY_BROKER_URL=redis://broker:6379/0
      - CELERY_RESULT_BACKEND=redis://broker:6379/0

      # External APIs
      # API Keys are now loaded from Supabase
      # - OPENAI_API_KEY
      # - ANTHROPIC_API_KEY
      # - GOOGLE_API_KEY
      # - GEMINI_API_KEY
      # - LINKUP_API_KEY
      - RAG_API_URL
      - RAG_API_KEY

      # Render / Image Gen
      - RENDER_SERVICE_URL=http://render_service:8080/generate-image

    # ports:
    #   - "5001:5001"
    depends_on:
      - broker
    volumes:
      - uploads_data:/app/_remotion/public/uploads

  worker:
    build: .
    restart: always
    command: celery -A celery_config.celery worker --loglevel=info -Q research,monitoring
    environment:
      # Application
      - SECRET_KEY
      - DEBUG
      - ENVIRONMENT
      - LOG_LEVEL
      - API_KEYS
      - PYTHONUNBUFFERED=1

      # Database
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - SUPABASE_ANON_KEY

      # Redis
      - REDIS_URL=redis://broker:6379/0
      - CELERY_BROKER_URL=redis://broker:6379/0
      - CELERY_RESULT_BACKEND=redis://broker:6379/0

      # External APIs
      - RAG_API_URL
      - RAG_API_KEY

      # Render / Image Gen
      - RENDER_SERVICE_URL=http://render_service:8080/generate-image

    depends_on:
      - backend
      - broker

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
        - VITE_API_KEY
        - VITE_API_URL
        - VITE_SITE_URL
    restart: always
    # Coolify derives the Traefik target port for SERVICE_FQDN_FRONTEND from this
    # expose entry. Without it Coolify guesses (it picked 5001, which nothing
    # listens on, so the public hostname returned Traefik 502 Bad Gateway).
    expose:
      - "80"
    # ports:
    #   - "3000:80"
    depends_on:
      - backend

  # The service name is deliberately NOT "redis".
  # Coolify attaches every compose service to its own shared `coolify` network, and
  # Coolify's own cache container already answers to the hostname `redis` there.
  # With two containers behind that name, DNS returns both addresses and whichever
  # answers first wins: connections that land on Coolify's password-protected cache
  # fail with "HELLO must be called with the client already authenticated" (the
  # Celery worker then retries forever and never consumes a task). A hostname nobody
  # else uses makes the broker unambiguous.
  broker:
    image: redis:7-alpine
    restart: always
    # ports:
    #   - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  render_service:
    build: ./screen_capture_html_css
    restart: always
    expose:
      - "8080"

volumes:
  redis_data:
  uploads_data:
